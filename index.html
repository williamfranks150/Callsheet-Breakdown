<!doctype html>
<html lang="en-CA">
<head>

<title>Callsheet Breakdown</title>
<script>
  const install = new URLSearchParams(location.search).get('install') === '1';
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  if (!install || standalone) {
    document.documentElement.classList.add('opening');
    location.replace('https://get-up-bill.william-franks.chatgpt.site/');
  }
</script>
<link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">

*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 5% 10%,#184052 0,transparent 58%),radial-gradient(ellipse at 100% 100%,#302342 0,transparent 60%),#0c1524;color:#edf4f7;font:1rem/1.5 system-ui,sans-serif}
main{width:min(100%,24rem);text-align:center}
.opening .install-only{display:none}
.opening a{margin-top:.5rem}
img{display:block;margin:0 auto 1.5rem;border-radius:1.6rem}
h1{margin:0 0 1.5rem;font-size:clamp(1.7rem,7vw,2.25rem);line-height:1.15}
a{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:.65rem 1.2rem;border:1px solid #80c7ca;border-radius:.75rem;background:#173543;color:#e6ffff;font-weight:650;text-decoration:none}

</style>
</head>

</html>
